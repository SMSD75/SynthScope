<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGID — AI-Generated Media Detector</title>
  <style>
/* ============================================================================
   AGID web interface — visual theme
   Modern dark "glass dashboard": layered navy gradient, frosted panels, an
   indigo→cyan accent, soft shadows, and smooth motion. Class names are kept
   stable so App.jsx is untouched.
   ========================================================================== */
:root {
  --bg: #070b16;
  --bg2: #0c1326;
  --panel: rgba(22, 29, 51, 0.72);
  --panel-solid: #161d33;
  --panel2: rgba(31, 41, 71, 0.55);
  --line: rgba(120, 140, 190, 0.16);
  --line-strong: rgba(120, 140, 190, 0.30);
  --text: #eef2fb;
  --muted: #9aa7c7;
  --muted2: #6b7796;
  --accent: #7c8cff;
  --accent2: #46d6ff;
  --accent-grad: linear-gradient(135deg, #7c8cff 0%, #46d6ff 100%);
  --real: #34d399;
  --fake: #ff6b7d;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.65);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.75);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(70, 214, 255, 0.10), transparent 60%),
    radial-gradient(1000px 700px at -5% 0%, rgba(124, 140, 255, 0.14), transparent 55%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.wrap { max-width: 1100px; margin: 0 auto; padding: 40px 22px 80px; }

/* ---- header ---------------------------------------------------------------*/
header { margin-bottom: 6px; }
header h1 {
  margin: 0 0 6px; font-size: 34px; font-weight: 800; letter-spacing: -0.02em;
  background: var(--accent-grad); -webkit-background-clip: text;
  background-clip: text; -webkit-text-fill-color: transparent;
}
header p { margin: 0; color: var(--muted); font-size: 15px; max-width: 720px; line-height: 1.5; }

/* ---- layout ---------------------------------------------------------------*/
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 26px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
}
.card h2 {
  margin: 0 0 14px; font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;
}

label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 7px; font-weight: 500; }

select, input[type=text], input[type=number] {
  width: 100%; padding: 11px 12px; border-radius: var(--radius-sm);
  background: var(--panel2); color: var(--text); border: 1px solid var(--line-strong);
  font-size: 14px; transition: border-color .15s, box-shadow .15s; outline: none;
}
select:focus, input[type=text]:focus, input[type=number]:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.22);
}
option { background: var(--panel-solid); }
option:disabled { color: #5a647e; }

/* ---- upload / drop --------------------------------------------------------*/
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
  padding: 30px; text-align: center; cursor: pointer; color: var(--muted);
  transition: border-color .18s, background .18s, color .18s, transform .18s;
}
.drop:hover { border-color: var(--accent); color: var(--text); }
.drop.drag { border-color: var(--accent2); background: rgba(70, 214, 255, 0.08); color: var(--text); transform: scale(1.01); }
.preview {
  margin-top: 16px; border-radius: var(--radius-sm); overflow: hidden; background: #000;
  max-height: 320px; display: flex; justify-content: center; border: 1px solid var(--line);
}
.preview img, .preview video { max-width: 100%; max-height: 320px; display: block; }

/* ---- buttons --------------------------------------------------------------*/
button.go, button.sm, button.primary {
  border: 0; border-radius: var(--radius-sm); background: var(--accent-grad);
  color: #06122b; font-weight: 700; cursor: pointer;
  box-shadow: 0 8px 20px -8px rgba(124, 140, 255, 0.6);
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s;
}
button.go { margin-top: 18px; width: 100%; padding: 13px; font-size: 15px; }
button.sm { padding: 11px 16px; white-space: nowrap; }
button.primary { padding: 9px 18px; }
button.go:hover:not(:disabled), button.sm:hover:not(:disabled), button.primary:hover:not(:disabled) {
  transform: translateY(-1px); box-shadow: 0 12px 26px -8px rgba(70, 214, 255, 0.55);
}
button.go:active, button.sm:active { transform: translateY(0); }
button.go:disabled, button.sm:disabled, button.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

.meta { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

/* ---- verdict / probability ------------------------------------------------*/
.verdict { font-size: 38px; font-weight: 800; text-align: center; margin: 6px 0 2px; letter-spacing: -0.02em; }
.verdict.real { color: var(--real); text-shadow: 0 0 28px rgba(52, 211, 153, 0.35); }
.verdict.fake { color: var(--fake); text-shadow: 0 0 28px rgba(255, 107, 125, 0.35); }

.bar {
  position: relative; height: 28px; border-radius: 9px; overflow: hidden; display: flex;
  background: var(--panel2); border: 1px solid var(--line); margin: 16px 0 6px;
}
.bar .fake { background: linear-gradient(90deg, #ff6b7d, #ff8a5d); }
.bar .real { background: linear-gradient(90deg, #34d399, #46d6ff); }
.bar span {
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #07101f; white-space: nowrap; transition: flex-basis .4s ease;
}
.bar .thrline { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.6); }

.row {
  display: flex; justify-content: space-between; font-size: 13px;
  padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--muted);
}
.row:last-child { border-bottom: 0; }
.row b { color: var(--text); }

/* ---- per-frame sparkline --------------------------------------------------*/
.frames { margin-top: 14px; }
.spark {
  position: relative; display: flex; gap: 2px; align-items: flex-end; height: 64px; margin-top: 8px;
  padding: 4px 4px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.spark i { flex: 1; background: var(--accent-grad); border-radius: 3px 3px 0 0; min-height: 3px; opacity: .9; }
.spark .thr50 { position: absolute; left: 6px; right: 6px; top: 50%; height: 0; border-top: 1px dashed #4a5572; pointer-events: none; }
.frame-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
.frame-stats b { color: var(--text); }

.err { color: var(--fake); font-size: 13px; margin-top: 12px; white-space: pre-wrap; }
.pill {
  display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--line-strong); color: var(--muted); margin-left: 8px;
}
.empty { color: var(--muted2); text-align: center; padding: 48px 0; font-size: 14px; }

/* ---- tabs -----------------------------------------------------------------*/
.tabs { display: flex; gap: 4px; margin-top: 26px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab {
  background: transparent; border: 0; color: var(--muted); padding: 11px 18px;
  cursor: pointer; font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: transparent;
  background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  border-bottom: 2px solid var(--accent); }

/* ---- data explorer --------------------------------------------------------*/
.toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.toolbar > div { flex: 1; min-width: 150px; }
.badge {
  display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 7px;
  background: var(--accent-grad); color: #06122b; font-weight: 700; margin-left: 6px; vertical-align: middle;
}
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 11px; margin-top: 18px; }
.thumb {
  position: relative; border-radius: var(--radius-sm); overflow: hidden; cursor: pointer;
  border: 2px solid transparent; background: #000; aspect-ratio: 1 / 1; transition: transform .15s, border-color .15s;
}
.thumb:hover { transform: translateY(-2px); }
.thumb.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.25); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tag { position: absolute; top: 5px; left: 5px; font-size: 10px; padding: 1px 7px; border-radius: 6px; font-weight: 700; letter-spacing: .03em; }
.thumb .tag.real { background: var(--real); color: #06210f; }
.thumb .tag.fake { background: var(--fake); color: #2a0707; }
.thumb .pred { position: absolute; bottom: 0; left: 0; right: 0; font-size: 10px; text-align: center; padding: 2px 0; font-weight: 700; }
.thumb .pred.ok { background: rgba(52, 211, 153, .92); color: #06210f; }
.thumb .pred.no { background: rgba(255, 107, 125, .92); color: #fff; }
.thumb .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(255,255,255,.85); pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

/* ---- threshold + calibration ----------------------------------------------*/
.thr { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel2); }
.thr input[type=range] { width: 100%; accent-color: var(--accent); }
.thr .lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.thr .lab b { color: var(--text); }
.calib { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.calib button { padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel2); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .15s; }
.calib button:hover:not(:disabled) { border-color: var(--accent); }
.calib button:disabled { opacity: .45; cursor: not-allowed; }
.calib input[type=number] { width: 64px; padding: 6px; }
.stat { font-size: 12px; color: var(--muted); margin-top: 8px; }
.stat b { color: var(--text); }

/* ---- per-model paper-vs-reproduced table ----------------------------------*/
table.repro { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
table.repro td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.repro td:first-child { color: var(--muted); width: 92px; white-space: nowrap; }
table.repro td.match-match { color: var(--real); }
table.repro td.match-gap-closed { color: var(--real); font-weight: 600; }
table.repro td.match-below, table.repro td.match-partial, table.repro td.match-ranking-only { color: #ffcf6e; }
table.repro td.match-pending { color: var(--muted); font-style: italic; }
table.repro td.rnote { color: var(--muted); font-size: 11px; font-style: italic; }

/* ---- full per-benchmark results table -------------------------------------*/
.repro-full { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 12px; }
.repro-full th { text-align: left; border-bottom: 1px solid var(--line-strong); padding: 4px 7px; color: var(--muted); }
.repro-full td { padding: 4px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
.status-reproduced { color: var(--real); font-weight: 600; }
.status-official { color: var(--accent); font-weight: 600; }
.status-below { color: #ffb74d; }
.status-missing { color: var(--muted2); }
.status-reference { color: var(--muted2); font-style: italic; }
.repro-wrap { margin: 10px 0 4px; }
.repro-details { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel2); overflow: hidden; }
.repro-details > summary { cursor: pointer; list-style: none; padding: 10px 13px; font-size: 12px; color: var(--accent); font-weight: 600; user-select: none; display: flex; align-items: center; gap: 7px; }
.repro-details > summary::-webkit-details-marker { display: none; }
.repro-details > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.repro-details[open] > summary::before { transform: rotate(90deg); }
.repro-scroll { max-height: 360px; overflow: auto; border-top: 1px solid var(--line); }
.repro-full thead th { position: sticky; top: 0; z-index: 1; background: var(--panel-solid); white-space: nowrap; }
.repro-full td:first-child { min-width: 170px; }
.repro-full tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
.repro-full tbody tr:hover { background: rgba(124, 140, 255, .07); }
.repro-legend { color: var(--muted); font-size: 11px; margin: 8px 12px 10px; line-height: 1.55; }
.lead-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin: 6px 0 16px; }
.lead-head .muted { flex: 1; min-width: 280px; color: var(--muted); }
.lead-head label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.lead-head select { width: auto; min-width: 220px; }
.lead-card { margin-bottom: 18px; }
.card.lead-card h2, .topgen .card h2 { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 17px; color: var(--text); }
.lead-bn { color: var(--muted); font-size: 10px; margin-top: 2px; }
.lb-best { color: var(--accent2); font-weight: 700; }
table.repro-full.lb-gen td { white-space: nowrap; }
table.repro-full.lb-gen td:nth-child(2) { white-space: normal; }
.lb-top td { background: rgba(124, 140, 255, .08); }
.topgen .card { margin-bottom: 18px; }

/* ---- SOTA generator vs detector comparison --------------------------------*/
.sota .sota-controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.sota .sota-controls label { display: flex; gap: 6px; align-items: center; }
.sota .promptline input { width: 320px; }
.sota .upbtn { cursor: pointer; text-decoration: underline; color: var(--accent); }
.sota .detpick { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
.sota .detpick label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
.sota .sota-images { display: flex; gap: 16px; margin: 14px 0; flex-wrap: wrap; }
.sota .sota-images figure { margin: 0; }
.sota .sota-images img { max-width: 320px; max-height: 320px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }

/* ---- weight-source badge --------------------------------------------------*/
.wtag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 8px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.wtag-official { background: rgba(46, 125, 82, .22); border-color: #2e7d52; color: #8ee0b0; }
.wtag-agid_trained { background: rgba(46, 93, 125, .22); border-color: #2e5d7d; color: #8ec6e0; }
.wtag-training_free { background: rgba(125, 102, 46, .22); border-color: #7d662e; color: #e0cf8e; }

/* ---- What's Trending ------------------------------------------------------*/
.trending h3 { margin: 22px 0 10px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.trend-card {
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px;
  background: var(--panel); box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
}
.trend-card:hover { transform: translateY(-3px); border-color: var(--line-strong); }
.trend-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.trend-head a { font-weight: 700; color: var(--text); text-decoration: none; }
.trend-head a:hover { color: var(--accent2); }
.trend-links { margin-top: 10px; display: flex; gap: 14px; font-size: 12px; }
.trend-links a { color: var(--accent); text-decoration: none; }
.trend-links a:hover { text-decoration: underline; }
.trend-landscape li { margin: 5px 0; }

/* links + scrollbars --------------------------------------------------------*/
a { color: var(--accent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }

<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;
    const html = htm.bind(React.createElement);

    const API = (p) => (window.AGID_API || "") + p;
    const optLabel = (m) => `${m.name} — ${m.paper}` + (m.available ? "" : "  (no checkpoint)");
    const verdictAt = (p, thr) => (p >= thr ? "fake" : "real");

    // --- threshold calibration helpers (client-side, from scored {p, gt} items) ---
    function balancedAccAt(scored, thr) {
      const reals = scored.filter(s => s.gt === "real"), fakes = scored.filter(s => s.gt === "fake");
      const tnr = reals.length ? reals.filter(s => s.p < thr).length / reals.length : 0;
      const tpr = fakes.length ? fakes.filter(s => s.p >= thr).length / fakes.length : 0;
      return { acc: (tpr + tnr) / 2, tpr, tnr };
    }
    function autoCalibrate(scored) {
      let best = 0.5, bestAcc = -1;
      for (let t = 0; t <= 1.0001; t += 0.01) {
        const a = balancedAccAt(scored, t).acc;
        if (a > bestAcc) { bestAcc = a; best = t; }
      }
      return Math.round(best * 100) / 100;
    }
    function targetFprThreshold(scored, fpr) {
      const reals = scored.filter(s => s.gt === "real").map(s => s.p).sort((a, b) => a - b);
      if (!reals.length) return null;
      // flag fake when p >= thr; FPR = fraction of reals >= thr. Pick the (1-fpr) quantile of reals.
      const idx = Math.min(reals.length - 1, Math.max(0, Math.ceil((1 - fpr) * reals.length) - 1));
      return Math.round(reals[idx] * 100) / 100;
    }
    function batchStats(scored, thr) {
      if (!scored.length) return null;
      const reals = scored.filter(s => s.gt === "real"), fakes = scored.filter(s => s.gt === "fake");
      const racc = reals.length ? reals.filter(s => s.p < thr).length / reals.length : null;
      const facc = fakes.length ? fakes.filter(s => s.p >= thr).length / fakes.length : null;
      const acc = scored.filter(s => verdictAt(s.p, thr) === s.gt).length / scored.length;
      return { n: scored.length, acc, racc, facc };
    }

    function ModelSelect({ models, model, setModel, onChange }) {
      const imageModels = models.filter(m => m.modality === "image");
      const videoModels = models.filter(m => m.modality === "video");
      return html`
        <select value=${model} onChange=${e => { setModel(e.target.value); onChange && onChange(); }}>
          <optgroup label="Image detectors">
            ${imageModels.map(m => html`<option key=${m.key} value=${m.key} disabled=${!m.available}>${optLabel(m)}</option>`)}
          </optgroup>
          <optgroup label="Video detectors">
            ${videoModels.map(m => html`<option key=${m.key} value=${m.key} disabled=${!m.available}>${optLabel(m)}</option>`)}
          </optgroup>
        </select>`;
    }

    function ReproTable({ m }) {
      const rep = m && m.repro;
      const full = m && m.repro_full;
      if (!rep && !(full && full.length)) return null;
      return html`<div class="repro-wrap">
        ${rep && html`<table class="repro"><tbody>
          <tr><td>Headline</td><td>${rep.benchmark}</td></tr>
          <tr><td>Paper</td><td>${rep.paper}</td></tr>
          <tr><td>Reproduced</td><td class=${"match-" + (rep.match || "")}>${rep.ours}</td></tr>
        </tbody></table>`}
        ${full && full.length > 0 && html`<details class="repro-details">
          <summary>All ${full.length} reported benchmarks — paper vs AGID vs official</summary>
          <div class="repro-scroll">
            <table class="repro-full">
              <thead><tr><th>Benchmark</th><th>Paper</th><th>AGID (trained)</th><th>Official wts</th><th>Status</th></tr></thead>
              <tbody>
                ${full.map((r, i) => html`<tr key=${i}>
                  <td>${r.benchmark}</td>
                  <td>${r.paper}</td>
                  <td>${r.ours_agid || "—"}</td>
                  <td>${r.ours_official || "—"}</td>
                  <td class=${"status-" + (r.status || "")}>${r.status}</td>
                </tr>`)}
              </tbody>
            </table>
          </div>
          <div class="repro-legend">
            <b>reproduced</b> = AGID-trained checkpoint matches the paper ·
            <b>official</b> = official weights loaded into the AGID class match (AGID-trained number shown where we trained from scratch) ·
            <b>below</b> = gap remains · <b>reference</b> = paper reports no comparable number · <b>missing</b> = not yet evaluated.
          </div>
        </details>`}
      </div>`;
    }

    function b64ToFile(b64, name) {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], name, { type: "image/png" });
    }

    // SOTA generator vs detector comparison: pick/upload a real image -> a current SOTA generator makes a
    // "conceptually similar" image -> the selected AGID detectors score it (best/promoted checkpoints).
    function SotaView({ models }) {
      const [gens, setGens] = useState([]);
      const [gen, setGen] = useState("");
      const [prompt, setPrompt] = useState("make another image conceptually similar to this");
      const [realB64, setRealB64] = useState("");
      const [realSrc, setRealSrc] = useState(null);
      const [picked, setPicked] = useState({});
      const [busy, setBusy] = useState(false);
      const [res, setRes] = useState(null);
      const [err, setErr] = useState("");
      const imgDetectors = (models || []).filter(m => m.modality === "image" && m.available);

      useEffect(() => {
        fetch(API("/api/sota/generators")).then(r => r.json()).then(d => {
          setGens(d.generators || []);
          const a = (d.generators || []).find(g => g.available);
          if (a) setGen(a.key);
          if (d.default_prompt) setPrompt(d.default_prompt);
        }).catch(e => setErr(String(e.message || e)));
      }, []);

      async function rollImage() {
        setErr(""); setRes(null);
        try {
          const r = await fetch(API("/api/sota/real_image")); const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setRealB64(d.image_b64); setRealSrc(d.source);
        } catch (e) { setErr(String(e.message || e)); }
      }
      function onUpload(f) {
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { setRealB64(rd.result.split(",")[1]); setRealSrc(["upload", f.name]); setRes(null); };
        rd.readAsDataURL(f);
      }
      async function run() {
        setErr(""); setBusy(true); setRes(null);
        try {
          const dets = Object.keys(picked).filter(k => picked[k]);
          if (!realB64) throw new Error("Pick or upload a real image first.");
          if (!gen) throw new Error("Select a generator.");
          if (!dets.length) throw new Error("Select at least one detector.");
          const fd = new FormData();
          fd.append("file", b64ToFile(realB64, "real.png"));
          fd.append("generator", gen); fd.append("detectors", dets.join(",")); fd.append("prompt", prompt);
          const r = await fetch(API("/api/sota/compare"), { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setRes(d);
        } catch (e) { setErr(String(e.message || e)); } finally { setBusy(false); }
      }

      return html`
        <div class="sota">
          <p class="muted">Send a real image from our datasets to a current SOTA generator, then see whether
            the AGID detectors catch the freshly-generated image. Generators need an API key
            (greyed-out = key not set on the server). Detectors use our best/promoted checkpoints.</p>
          <div class="sota-controls">
            <div>
              <button onClick=${rollImage}>🎲 Random real image</button>
              <label class="upbtn">Upload<input type="file" accept="image/*" style=${{display:"none"}}
                onChange=${e => onUpload(e.target.files[0])} /></label>
            </div>
            <label>Generator:
              <select value=${gen} onChange=${e => setGen(e.target.value)}>
                ${gens.map(g => html`<option key=${g.key} value=${g.key} disabled=${!g.available}>
                  ${g.name}${g.available ? "" : " (no API key)"}</option>`)}
              </select>
            </label>
            <label class="promptline">Prompt:
              <input value=${prompt} onChange=${e => setPrompt(e.target.value)} />
            </label>
          </div>
          <div class="detpick">Detectors:
            ${imgDetectors.map(m => html`<label key=${m.key}><input type="checkbox" checked=${!!picked[m.key]}
              onChange=${e => setPicked({ ...picked, [m.key]: e.target.checked })} /> ${m.name}</label>`)}
          </div>
          <button class="primary" disabled=${busy} onClick=${run}>${busy ? "Generating + scoring…" : "Generate & compare"}</button>
          ${err && html`<div class="err">${err}</div>`}
          <div class="sota-images">
            ${realB64 && html`<figure><img src=${"data:image/png;base64," + realB64} />
              <figcaption>Real ${realSrc ? "· " + realSrc.join("/") : ""}</figcaption></figure>`}
            ${res && res.generated_b64 && html`<figure><img src=${"data:image/png;base64," + res.generated_b64} />
              <figcaption>Generated · ${res.generator}${res.prompt ? html`<br/><span class="muted" style=${{fontSize:11}}>prompt: ${res.prompt}</span>` : ""}</figcaption></figure>`}
          </div>
          ${res && html`<table class="repro-full">
            <thead><tr><th>Detector</th><th>P(fake) real</th><th>P(fake) generated</th><th>Caught?</th></tr></thead>
            <tbody>
              ${res.results.map((r, i) => html`<tr key=${i}>
                <td>${r.name || r.detector}</td>
                <td>${r.error ? "—" : r.real_fake_prob}</td>
                <td>${r.error ? "—" : r.gen_fake_prob}</td>
                <td class=${r.caught ? "status-reproduced" : "status-below"}>
                  ${r.error ? r.error : (r.caught ? "✓ fake" : "✗ missed")}</td>
              </tr>`)}
            </tbody>
          </table>`}
        </div>`;
    }

    function ThresholdSlider({ threshold, setThreshold, children }) {
      return html`<div class="thr">
        <div class="lab"><span>Decision threshold</span><span>P(fake) ≥ <b>${threshold.toFixed(2)}</b> → fake</span></div>
        <input type="range" min="0" max="1" step="0.01" value=${threshold}
          onInput=${e => setThreshold(parseFloat(e.target.value))} />
        ${children}
      </div>`;
    }

    const REPRO_LEGEND = html`<div class="repro-legend">
      <b>reproduced</b> = AGID-trained checkpoint matches the paper ·
      <b>official</b> = official weights loaded into the AGID class match (AGID-trained shown alongside where trained from scratch) ·
      <b>below</b> = gap remains · <b>reference</b> = paper reports no comparable number · <b>missing</b> = not yet evaluated.</div>`;

    // Leaderboard: every method x benchmark (paper / AGID-trained / official-weights), grouped by benchmark.
    function LeaderboardView() {
      const [groups, setGroups] = useState([]);
      const [sel, setSel] = useState("");
      const [err, setErr] = useState("");
      useEffect(() => {
        fetch(API("/api/leaderboard")).then(r => r.json()).then(d => setGroups(d.groups || []))
          .catch(e => setErr(String(e.message || e)));
      }, []);
      const shown = sel ? groups.filter(g => g.benchmark === sel) : groups;
      return html`<div class="lead">
        <div class="lead-head">
          <p class="muted">Every benchmark each paper reports, with the <b>paper</b> number, our <b>AGID-trained</b>
            checkpoint, and <b>official weights</b> loaded into the AGID class. Grouped by benchmark so methods that
            share one can be compared head-to-head (sorted best-first within each).</p>
          <label>Benchmark:
            <select value=${sel} onChange=${e => setSel(e.target.value)}>
              <option value="">All benchmarks (${groups.length})</option>
              ${groups.map(g => html`<option key=${g.benchmark} value=${g.benchmark}>${g.benchmark} (${g.n_methods})</option>`)}
            </select>
          </label>
        </div>
        ${err && html`<div class="err">${err}</div>`}
        ${shown.map(g => html`<div key=${g.benchmark} class="card lead-card">
          <h2>${g.benchmark} <span class="pill">${g.n_methods} method${g.n_methods > 1 ? "s" : ""}</span></h2>
          <div class="repro-scroll">
            <table class="repro-full">
              <thead><tr><th>Method</th><th>Paper</th><th>AGID (trained)</th><th>Official wts</th><th>Status</th></tr></thead>
              <tbody>
                ${g.rows.map((r, i) => html`<tr key=${i}>
                  <td><b>${r.method}</b><div class="lead-bn">${r.benchmark}</div></td>
                  <td>${r.paper}</td>
                  <td>${r.agid || "—"}</td>
                  <td>${r.official || "—"}</td>
                  <td class=${"status-" + (r.status || "")}>${r.status}</td>
                </tr>`)}
              </tbody>
            </table>
          </div>
        </div>`)}
        ${REPRO_LEGEND}
      </div>`;
    }

    // Top Generators: how detectors hold up against today's SOTA generators (Ideogram, ...).
    function TopGeneratorsView() {
      const [bm, setBm] = useState([]);
      const [err, setErr] = useState("");
      useEffect(() => {
        fetch(API("/api/generator_benchmarks")).then(r => r.json()).then(d => setBm(d.benchmarks || []))
          .catch(e => setErr(String(e.message || e)));
      }, []);
      return html`<div class="topgen">
        <p class="muted">How our detectors hold up against today's SOTA image generators. Each: a balanced
          real-vs-generated set scored by every AGID detector (promoted checkpoints), ranked by AUROC.
          None of the detectors were trained on these generators — this is cross-generator generalization.</p>
        ${err && html`<div class="err">${err}</div>`}
        ${!bm.length && !err && html`<div class="empty">No generator benchmarks yet.</div>`}
        ${bm.map(b => html`<div key=${b.key} class="card">
          <h2>vs ${b.generator} <span class="pill">${b.n_real}+${b.n_fake} imgs · ${b.settings}</span></h2>
          <div class="meta" style=${{marginBottom: 8}}>${b.note}</div>
          <div class="repro-scroll">
            <table class="repro-full lb-gen">
              <thead><tr><th>#</th><th>Detector</th><th>AUROC</th><th>AP</th><th>acc@.5</th><th>fake-detect %</th><th>real-FP %</th></tr></thead>
              <tbody>
                ${b.rows.map((r, i) => html`<tr key=${i} class=${i < 3 ? "lb-top" : ""}>
                  <td>${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1)}</td>
                  <td><b>${r.name || r.detector}</b></td>
                  <td class="lb-best">${r.auroc}</td>
                  <td>${r.ap}</td><td>${r.acc}</td><td>${r.fake_detect_rate}</td><td>${r.real_false_pos}</td>
                </tr>`)}
              </tbody>
            </table>
          </div>
        </div>`)}
      </div>`;
    }

    function App() {
      const [models, setModels] = useState([]);
      const [device, setDevice] = useState("");
      const [model, setModel] = useState("");
      const [tab, setTab] = useState("detect");
      const [threshold, setThreshold] = useState(0.5);
      const [error, setError] = useState("");

      useEffect(() => {
        fetch(API("/api/models")).then(r => r.json()).then(d => {
          setModels(d.models || []);
          setDevice(d.device || "");
          const firstAvail = (d.models || []).find(m => m.available);
          if (firstAvail) setModel(firstAvail.key);
        }).catch(e => setError("Could not reach backend: " + e));
      }, []);

      const shared = { models, model, setModel, threshold, setThreshold };
      return html`
        <div class="wrap">
          <header>
            <h1>AGID — AI-Generated Media Detector</h1>
            <p>Detect AI-generated media, or explore the datasets each detector was trained / tested on.
               ${device && html`<span class="pill" style=${{marginLeft:8}}>device: ${device}</span>`}</p>
          </header>
          <div class="tabs">
            <button class=${"tab" + (tab==="detect"?" active":"")} onClick=${() => setTab("detect")}>Detect</button>
            <button class=${"tab" + (tab==="explore"?" active":"")} onClick=${() => setTab("explore")}>Data Explorer</button>
            <button class=${"tab" + (tab==="sota"?" active":"")} onClick=${() => setTab("sota")}>SOTA vs Detectors</button>
            <button class=${"tab" + (tab==="leaderboard"?" active":"")} onClick=${() => setTab("leaderboard")}>Leaderboard</button>
            <button class=${"tab" + (tab==="topgen"?" active":"")} onClick=${() => setTab("topgen")}>Top Generators</button>
          </div>
          ${error && html`<div class="err">${error}</div>`}
          ${tab === "detect" ? html`<${DetectView} ...${shared} />`
            : tab === "explore" ? html`<${ExploreView} ...${shared} />`
            : tab === "sota" ? html`<${SotaView} models=${models} />`
            : tab === "leaderboard" ? html`<${LeaderboardView} />`
            : html`<${TopGeneratorsView} />`}
        </div>`;
    }

    function DetectView({ models, model, setModel, threshold, setThreshold }) {
      const [file, setFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [isVideo, setIsVideo] = useState(false);
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      const [drag, setDrag] = useState(false);
      const inputRef = useRef();
      const selected = models.find(m => m.key === model);

      function onPick(f) {
        if (!f) return;
        setFile(f); setResult(null); setError("");
        setIsVideo((f.type || "").startsWith("video") || /\.(mp4|mov|avi|mkv|webm|m4v)$/i.test(f.name));
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        setPreviewUrl(URL.createObjectURL(f));
      }
      async function run() {
        if (!file || !model) return;
        setBusy(true); setResult(null); setError("");
        try {
          const fd = new FormData(); fd.append("file", file); fd.append("model", model);
          const r = await fetch(API("/api/predict"), { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setResult(d);
        } catch (e) { setError(String(e.message || e)); }
        finally { setBusy(false); }
      }

      return html`
        <div class="grid">
          <div class="card">
            <h2>Input</h2>
            <label>Detector model</label>
            <${ModelSelect} models=${models} model=${model} setModel=${setModel} onChange=${() => setResult(null)} />
            ${selected && html`<div class="meta">${selected.notes}
              ${selected.modality === "image" ? " · On a video, runs frame-by-frame and averages." : " · Native video model."}</div>`}
            ${selected && html`<${ReproTable} m=${selected} />`}

            <label>Media file</label>
            <div class=${"drop" + (drag ? " drag" : "")}
              onClick=${() => inputRef.current.click()}
              onDragOver=${e => { e.preventDefault(); setDrag(true); }}
              onDragLeave=${() => setDrag(false)}
              onDrop=${e => { e.preventDefault(); setDrag(false); onPick(e.dataTransfer.files[0]); }}>
              ${file ? html`<b>${file.name}</b> <span class="meta">(${(file.size/1048576).toFixed(2)} MB)</span>`
                     : "Click or drop an image / video here"}
            </div>
            <input ref=${inputRef} type="file" accept="image/*,video/*" style=${{display:"none"}}
              onChange=${e => onPick(e.target.files[0])} />
            ${previewUrl && html`<div class="preview">
              ${isVideo ? html`<video src=${previewUrl} controls/>` : html`<img src=${previewUrl}/>`}
            </div>`}
            <button class="go" disabled=${!file || !model || busy} onClick=${run}>
              ${busy ? "Analyzing…" : "Analyze"}
            </button>
            ${error && html`<div class="err">${error}</div>`}
          </div>

          <div class="card">
            <h2>Result</h2>
            ${!result && !busy && html`<div class="empty">No result yet.</div>`}
            ${busy && html`<div class="empty">Running ${selected ? selected.name : ""}… first run loads the model and may take a while.</div>`}
            ${result && html`<${Result} r=${result} threshold=${threshold} />`}
            ${result && html`<${ThresholdSlider} threshold=${threshold} setThreshold=${setThreshold} />`}
          </div>
        </div>`;
    }

    function ExploreView({ models, model, setModel, threshold, setThreshold }) {
      const [datasets, setDatasets] = useState([]);
      const [trainMap, setTrainMap] = useState({});
      const [dataset, setDataset] = useState("");
      const [split, setSplit] = useState("");
      const [seed, setSeed] = useState(1);
      const [items, setItems] = useState([]);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const [sel, setSel] = useState(null);
      const [preds, setPreds] = useState({});      // rel -> {fake_probability, ground_truth, ...}
      const [scoring, setScoring] = useState(false);
      const [fpr, setFpr] = useState(5);
      const batchN = 24;

      const curDs = datasets.find(d => d.key === dataset);
      const trainDsKey = (trainMap[model] || {}).dataset;

      useEffect(() => {
        fetch(API("/api/datasets")).then(r => r.json()).then(d => {
          setDatasets(d.datasets || []); setTrainMap(d.model_train || {});
          if ((d.datasets || []).length) {
            const first = d.datasets[0];
            setDataset(first.key); setSplit(first.splits[first.splits.length - 1] || ".");
          }
        }).catch(e => setError("Could not load datasets: " + e));
      }, []);

      useEffect(() => {
        if (!curDs) return;
        const s = curDs.splits.includes(split) ? split : (curDs.splits[curDs.splits.length - 1] || ".");
        if (s !== split) setSplit(s);
        loadBatch(dataset, s, seed);
      }, [dataset]);

      async function loadBatch(dsKey, sp, sd) {
        if (!dsKey) return;
        setBusy(true); setError(""); setItems([]); setSel(null); setPreds({});
        try {
          const r = await fetch(API(`/api/datasets/${dsKey}/sample?split=${encodeURIComponent(sp)}&n=${batchN}&seed=${sd}`));
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setItems(d.items || []);
        } catch (e) { setError(String(e.message || e)); }
        finally { setBusy(false); }
      }
      function newBatch() { const sd = seed + 1; setSeed(sd); loadBatch(dataset, split, sd); }

      async function pickItem(it) {
        setSel(it.rel);
        if (!model || preds[it.rel]) return;
        try {
          const fd = new FormData();
          fd.append("dataset", dataset); fd.append("rel", it.rel); fd.append("model", model);
          const r = await fetch(API("/api/predict_dataset"), { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setPreds(p => ({ ...p, [it.rel]: d }));
        } catch (e) { setPreds(p => ({ ...p, [it.rel]: { error: String(e.message || e) } })); }
      }

      async function scoreAll() {
        if (!model || !items.length) return;
        setScoring(true); setError("");
        try {
          const r = await fetch(API("/api/score_batch"), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dataset, model, rels: items.map(i => i.rel) }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          const m = {};
          for (const it of d.items) m[it.rel] = it;
          setPreds(p => ({ ...p, ...m }));
          return d.items.filter(x => x.ground_truth && typeof x.fake_probability === "number")
                        .map(x => ({ p: x.fake_probability, gt: x.ground_truth }));
        } catch (e) { setError(String(e.message || e)); return []; }
        finally { setScoring(false); }
      }

      const scored = items.map(i => preds[i.rel]).filter(x => x && typeof x.fake_probability === "number" && x.ground_truth)
                          .map(x => ({ p: x.fake_probability, gt: x.ground_truth }));

      async function calibrate() { const s = scored.length ? scored : await scoreAll(); if (s.length) setThreshold(autoCalibrate(s)); }
      async function applyFpr() {
        const s = scored.length ? scored : await scoreAll();
        const t = targetFprThreshold(s, fpr / 100);
        if (t != null) setThreshold(t); else setError("Need scored real videos for target-FPR.");
      }

      const mediaUrl = (it, thumb) =>
        API(`/api/datasets/${dataset}/media?rel=${encodeURIComponent(it.rel)}${thumb ? "&thumb=1" : ""}`);
      const selItem = items.find(i => i.rel === sel);
      const selRes = sel ? preds[sel] : null;
      const stats = batchStats(scored, threshold);

      return html`
        <div class="grid" style=${{gridTemplateColumns: "2fr 1fr"}}>
          <div class="card">
            <h2>Datasets</h2>
            <label>Detector model</label>
            <${ModelSelect} models=${models} model=${model} setModel=${setModel} />
            ${trainDsKey && html`<div class="meta">Trained on
              <b>${(datasets.find(d=>d.key===trainDsKey)||{}).name || trainDsKey}</b>
              ${(trainMap[model]||{}).official ? html`<span class="badge">official wts</span>` : ""}</div>`}
            <${ReproTable} m=${models.find(m => m.key === model)} />

            <div class="toolbar" style=${{marginTop: 14}}>
              <div><label>Dataset</label>
                <select value=${dataset} onChange=${e => setDataset(e.target.value)}>
                  ${datasets.map(d => html`<option key=${d.key} value=${d.key}>
                    ${d.name}${d.key === trainDsKey ? " ★ trains " + model : ""} · ${d.modality}</option>`)}
                </select></div>
              <div style=${{maxWidth: 130}}><label>Split</label>
                <select value=${split} onChange=${e => { setSplit(e.target.value); loadBatch(dataset, e.target.value, seed); }}>
                  ${(curDs ? curDs.splits : []).map(s => html`<option key=${s} value=${s}>${s === "." ? "(all)" : s}</option>`)}
                </select></div>
              <div style=${{maxWidth: 110, flex: "0 0 auto"}}><button class="sm" disabled=${busy} onClick=${newBatch}>↻ New batch</button></div>
            </div>

            <${ThresholdSlider} threshold=${threshold} setThreshold=${setThreshold}>
              <div class="calib">
                <button disabled=${scoring || !model} onClick=${scoreAll}>${scoring ? "Scoring…" : "Score batch"}</button>
                <button disabled=${scoring || !model} onClick=${calibrate} title="Threshold that maximizes balanced accuracy on this labeled batch">Auto-calibrate</button>
                <button disabled=${scoring || !model} onClick=${applyFpr}>Target FPR</button>
                <input type="number" min="0" max="50" step="1" value=${fpr} onChange=${e => setFpr(parseFloat(e.target.value) || 0)} />%
              </div>
              ${stats && html`<div class="stat">batch (${stats.n} scored) @${threshold.toFixed(2)}:
                <b>acc ${(stats.acc*100).toFixed(0)}%</b>
                ${stats.racc != null ? html` · real ${(stats.racc*100).toFixed(0)}%` : ""}
                ${stats.facc != null ? html` · fake ${(stats.facc*100).toFixed(0)}%` : ""}</div>`}
            </${ThresholdSlider}>

            ${error && html`<div class="err">${error}</div>`}
            ${busy && html`<div class="empty">Sampling…</div>`}
            <div class="thumbs">
              ${items.map(it => {
                const pr = preds[it.rel];
                const has = pr && typeof pr.fake_probability === "number";
                const v = has ? verdictAt(pr.fake_probability, threshold) : null;
                const ok = has && v === it.label;
                return html`<div key=${it.rel} class=${"thumb" + (it.rel === sel ? " sel" : "")} onClick=${() => pickItem(it)} title=${it.name}>
                  <img loading="lazy" src=${mediaUrl(it, true)} />
                  <span class=${"tag " + it.label}>${it.label}</span>
                  ${it.modality === "video" && html`<span class="play">▶</span>`}
                  ${has && html`<span class=${"pred " + (ok ? "ok" : "no")}>${(pr.fake_probability*100).toFixed(0)}% ${ok ? "✓" : "✗"}</span>`}
                </div>`;
              })}
            </div>
          </div>

          <div class="card">
            <h2>Model output</h2>
            ${!selItem && html`<div class="empty">Click a sample to run ${(models.find(m=>m.key===model)||{}).name || "the model"} on it. Use "Score batch" + Auto-calibrate / Target FPR to set the threshold.</div>`}
            ${selItem && html`<div>
              <div class="preview">
                ${selItem.modality === "video" ? html`<video src=${mediaUrl(selItem, false)} controls/>` : html`<img src=${mediaUrl(selItem, false)}/>`}
              </div>
              <div class="meta">${selItem.name} · ground truth: <b style=${{color: selItem.label==="fake"?"var(--fake)":"var(--real)"}}>${selItem.label}</b></div>
              ${selRes && selRes.error && html`<div class="err">${selRes.error}</div>`}
              ${selRes && !selRes.error && typeof selRes.fake_probability === "number" && html`<${Result} r=${selRes} threshold=${threshold} gt=${selItem.label} />`}
            </div>`}
          </div>
        </div>`;
    }

    function Result({ r, threshold, gt }) {
      const fakePct = r.fake_probability * 100, realPct = (1 - r.fake_probability) * 100;
      const verdict = verdictAt(r.fake_probability, threshold);
      const correct = gt ? (verdict === gt) : null;
      return html`
        <div class=${"verdict " + verdict}>${verdict === "fake" ? "AI-GENERATED" : "REAL"}</div>
        <div style=${{textAlign:"center", color:"var(--muted)", fontSize:13}}>
          P(fake) ${fakePct.toFixed(1)}% vs threshold ${threshold.toFixed(2)}
          ${correct != null ? html` · <b style=${{color: correct ? "var(--real)" : "var(--fake)"}}>${correct ? "correct" : "wrong"}</b>` : ""}</div>
        <div class="bar">
          <span class="fake" style=${{width: fakePct + "%"}}>${fakePct >= 12 ? "fake " + fakePct.toFixed(0) + "%" : ""}</span>
          <span class="real" style=${{width: realPct + "%"}}>${realPct >= 12 ? "real " + realPct.toFixed(0) + "%" : ""}</span>
          <span class="thrline" style=${{left: (threshold*100) + "%"}}></span>
        </div>
        <div style=${{marginTop:14}}>
          <div class="row"><span>P(fake)</span><b>${fakePct.toFixed(2)}%</b></div>
          <div class="row"><span>Model</span><b>${r.model_name || ""}</b></div>
          ${r.media_type && html`<div class="row"><span>Media</span><b>${r.media_type}${r.num_frames ? " · " + r.num_frames + " frames" : ""}</b></div>`}
          ${r.elapsed_ms && html`<div class="row"><span>Inference</span><b>${r.elapsed_ms} ms</b></div>`}
        </div>
        ${r.per_frame && r.per_frame.length > 1 && html`<div class="frames">
          <div class="meta">Per-frame P(fake) — ${r.per_frame.length} frames sampled (dashed line = 50% threshold):</div>
          <div class="spark">
            <span class="thr50"></span>
            ${r.per_frame.map((v,i) => html`<i key=${i} title=${"frame " + (i+1) + ": " + (v*100).toFixed(1) + "%"}
              style=${{height: Math.max(3, v*100) + "%", background: v >= 0.5 ? "var(--fake)" : "var(--accent)"}}/>`)}
          </div>
          <div class="frame-stats">
            <span>min <b>${(Math.min(...r.per_frame)*100).toFixed(0)}%</b></span>
            <span>mean <b>${(r.per_frame.reduce((a,b)=>a+b,0)/r.per_frame.length*100).toFixed(0)}%</b></span>
            <span>max <b>${(Math.max(...r.per_frame)*100).toFixed(0)}%</b></span>
          </div>
        </div>`}`;
    }

    createRoot(document.getElementById("root")).render(html`<${App}/>`);
  </script>
</body>
</html>
