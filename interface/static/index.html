<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGID — AI-Generated Media Detector</title>
  <style>
    :root {
      --bg: #0b0f1a; --panel: #141a2b; --panel2: #1c2438; --line: #2a3450;
      --text: #e8edf7; --muted: #93a0bd; --accent: #6ea8ff;
      --real: #2ecc71; --fake: #ff5d5d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 18px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
    select { width: 100%; padding: 10px; border-radius: 9px; background: var(--panel2);
      color: var(--text); border: 1px solid var(--line); font-size: 14px; }
    option:disabled { color: #5a647e; }
    .drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px;
      text-align: center; cursor: pointer; transition: .15s; color: var(--muted); }
    .drop.drag { border-color: var(--accent); background: #16203a; color: var(--text); }
    .preview { margin-top: 14px; border-radius: 10px; overflow: hidden;
      background: #000; max-height: 320px; display: flex; justify-content: center; }
    .preview img, .preview video { max-width: 100%; max-height: 320px; display: block; }
    button.go { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: var(--accent); color: #06122b; font-weight: 700; font-size: 15px; cursor: pointer; }
    button.go:disabled { opacity: .45; cursor: not-allowed; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .verdict { font-size: 34px; font-weight: 800; text-align: center; margin: 4px 0 2px; }
    .verdict.real { color: var(--real); } .verdict.fake { color: var(--fake); }
    .bar { height: 26px; border-radius: 8px; overflow: hidden; display: flex;
      background: var(--panel2); border: 1px solid var(--line); margin: 14px 0 6px; }
    .bar .fake { background: var(--fake); } .bar .real { background: var(--real); }
    .bar span { display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #07101f; white-space: nowrap; }
    .row { display: flex; justify-content: space-between; font-size: 13px;
      padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .row b { color: var(--text); }
    .spark { display: flex; gap: 2px; align-items: flex-end; height: 48px; margin-top: 8px; }
    .spark i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
    .err { color: var(--fake); font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
    a { color: var(--accent); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "htm/react": "https://esm.sh/htm@3.1.1/react?deps=react@18.2.0"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React, { useState, useEffect, useRef } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm/react";
    const html = htm.bind(React.createElement);

    const API = (p) => (window.AGID_API || "") + p;

    function App() {
      const [models, setModels] = useState([]);
      const [device, setDevice] = useState("");
      const [model, setModel] = useState("");
      const [file, setFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [isVideo, setIsVideo] = useState(false);
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      const [drag, setDrag] = useState(false);
      const inputRef = useRef();

      useEffect(() => {
        fetch(API("/api/models")).then(r => r.json()).then(d => {
          setModels(d.models || []);
          setDevice(d.device || "");
          const firstAvail = (d.models || []).find(m => m.available);
          if (firstAvail) setModel(firstAvail.key);
        }).catch(e => setError("Could not reach backend: " + e));
      }, []);

      function onPick(f) {
        if (!f) return;
        setFile(f); setResult(null); setError("");
        setIsVideo((f.type || "").startsWith("video") || /\.(mp4|mov|avi|mkv|webm|m4v)$/i.test(f.name));
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        setPreviewUrl(URL.createObjectURL(f));
      }

      async function run() {
        if (!file || !model) return;
        setBusy(true); setResult(null); setError("");
        try {
          const fd = new FormData();
          fd.append("file", file); fd.append("model", model);
          const r = await fetch(API("/api/predict"), { method: "POST", body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
          setResult(d);
        } catch (e) { setError(String(e.message || e)); }
        finally { setBusy(false); }
      }

      const selected = models.find(m => m.key === model);
      const imageModels = models.filter(m => m.modality === "image");
      const videoModels = models.filter(m => m.modality === "video");
      const optLabel = (m) => `${m.name} — ${m.paper}` + (m.available ? "" : "  (no checkpoint)");

      return html`
        <div class="wrap">
          <header>
            <h1>AGID — AI-Generated Media Detector</h1>
            <p>Upload an image or video, pick a detector, and get the probability it is AI-generated.
               ${device && html`<span class="pill" style=${{marginLeft:8}}>device: ${device}</span>`}</p>
          </header>

          <div class="grid">
            <div class="card">
              <h2>Input</h2>
              <label>Detector model</label>
              <select value=${model} onChange=${e => { setModel(e.target.value); setResult(null); }}>
                <optgroup label="Image detectors">
                  ${imageModels.map(m => html`<option key=${m.key} value=${m.key} disabled=${!m.available}>${optLabel(m)}</option>`)}
                </optgroup>
                <optgroup label="Video detectors">
                  ${videoModels.map(m => html`<option key=${m.key} value=${m.key} disabled=${!m.available}>${optLabel(m)}</option>`)}
                </optgroup>
              </select>
              ${selected && html`<div class="meta">${selected.notes}
                ${selected.modality === "image" ? " · On a video, runs frame-by-frame and averages." : " · Native video model."}</div>`}

              <label>Media file</label>
              <div class=${"drop" + (drag ? " drag" : "")}
                onClick=${() => inputRef.current.click()}
                onDragOver=${e => { e.preventDefault(); setDrag(true); }}
                onDragLeave=${() => setDrag(false)}
                onDrop=${e => { e.preventDefault(); setDrag(false); onPick(e.dataTransfer.files[0]); }}>
                ${file ? html`<b>${file.name}</b> <span class="meta">(${(file.size/1048576).toFixed(2)} MB)</span>`
                       : "Click or drop an image / video here"}
              </div>
              <input ref=${inputRef} type="file" accept="image/*,video/*" style=${{display:"none"}}
                onChange=${e => onPick(e.target.files[0])} />

              ${previewUrl && html`<div class="preview">
                ${isVideo ? html`<video src=${previewUrl} controls/>` : html`<img src=${previewUrl}/>`}
              </div>`}

              <button class="go" disabled=${!file || !model || busy} onClick=${run}>
                ${busy ? "Analyzing…" : "Analyze"}
              </button>
              ${error && html`<div class="err">${error}</div>`}
            </div>

            <div class="card">
              <h2>Result</h2>
              ${!result && !busy && html`<div class="empty">No result yet.</div>`}
              ${busy && html`<div class="empty">Running ${selected ? selected.name : ""}… first run loads the model and may take a while.</div>`}
              ${result && html`<${Result} r=${result} />`}
            </div>
          </div>
        </div>`;
    }

    function Result({ r }) {
      const fakePct = (r.fake_probability * 100);
      const realPct = (r.real_probability * 100);
      return html`
        <div class=${"verdict " + r.verdict}>${r.verdict === "fake" ? "AI-GENERATED" : "REAL"}</div>
        <div style=${{textAlign:"center", color:"var(--muted)", fontSize:13}}>
          confidence ${(r.confidence*100).toFixed(1)}%</div>
        <div class="bar">
          <span class="fake" style=${{width: fakePct + "%"}}>${fakePct >= 12 ? "fake " + fakePct.toFixed(1) + "%" : ""}</span>
          <span class="real" style=${{width: realPct + "%"}}>${realPct >= 12 ? "real " + realPct.toFixed(1) + "%" : ""}</span>
        </div>
        <div style=${{marginTop:14}}>
          <div class="row"><span>P(fake)</span><b>${fakePct.toFixed(2)}%</b></div>
          <div class="row"><span>P(real)</span><b>${realPct.toFixed(2)}%</b></div>
          <div class="row"><span>Model</span><b>${r.model_name}</b></div>
          <div class="row"><span>Media</span><b>${r.media_type}${r.num_frames ? " · " + r.num_frames + " frames" : ""}</b></div>
          <div class="row"><span>Inference</span><b>${r.elapsed_ms} ms</b></div>
        </div>
        ${r.per_frame && html`<div>
          <div class="meta">Per-frame P(fake) (${r.aggregation}):</div>
          <div class="spark">${r.per_frame.map((v,i) => html`<i key=${i} title=${(v*100).toFixed(1)+"%"} style=${{height:(v*100)+"%"}}/>`)}</div>
        </div>`}
        ${r.checkpoint_status && html`<div class="meta" style=${{marginTop:12}}>ckpt: ${r.checkpoint_status}</div>`}`;
    }

    createRoot(document.getElementById("root")).render(html`<${App}/>`);
  </script>
</body>
</html>
