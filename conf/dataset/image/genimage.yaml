name: genimage
root_dir: /hddstore/ssalehi/SynthScope/GenImage
source_url: https://drive.google.com/drive/folders/1jGt10bwTbhEZuGXLyvrCuxOI0cBqQ1FS
# HuggingFace mirror (used instead of source_url when hf_repo_id is set).
# hf_subdir selects one GenImage generator dir; null/"" downloads the whole repo.
hf_repo_id: jzousz/GenImage
hf_subdir: stable_diffusion_v_1_4
train_batch_size: 512
val_batch_size: 2048
test_batch_size: 2048
num_workers: 8
persistent_workers: true
pin_memory: true
prefetch: true
train_transform_list:
  - resize_short_256
  - gaussian_blur
  - jpeg_compression
  - random_crop_224
  - random_horizontal_flip
  - to_dtype
  - normalize_clip
eval_transform_list:
  - resize_short_256
  - center_crop_224
  - to_dtype
  - normalize_clip
