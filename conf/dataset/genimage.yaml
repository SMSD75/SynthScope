name: genimage
root_dir: /nvmestore/ssalehi/AGID/GenImage
source_url: https://drive.google.com/drive/folders/1jGt10bwTbhEZuGXLyvrCuxOI0cBqQ1FS
train_batch_size: 512
val_batch_size: 2048
test_batch_size: 2048
num_workers: 8
persistent_workers: true
pin_memory: true
prefetch: true
train_transform_list:
  - resize_short
  - gaussian_blur
  - jpeg_compression
  - random_crop
  - random_horizontal_flip
  - to_dtype
  - normalize_clip
eval_transform_list:
  - resize_short
  - center_crop
  - to_dtype
  - normalize_clip
