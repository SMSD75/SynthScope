name: vidprom
# VidProM (Wang & Yang 2024), D3 Table 4 and ReStraV: ModelScope, Pika, Text2Video-Zero, VideoCrafter2 (CC BY-NC 4.0).
# VidProMDataset streams the first 1000 clips of tar part 1 per generator (the full set is terabytes) and pairs them
# with GenVideo-Val's MSR-VTT reals.
root_dir: /hddstore/ssalehi/SynthScope/VidProM
hf_repo_id: WenhaoWang/VidProM
# 24 frames evenly across 2 s works for both ReStraV (needs >=8) and D3 (needs >=4).
# Override num_frames/fps on the command line if you want D3's 16-frame@8fps sampling.
num_frames: 24
fps: null
window_seconds: 2.0
frame_size: 224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 4
persistent_workers: true
pin_memory: true
prefetch: true
# Normalization happens HERE (not in the model). Default normalize_dinov2 = ReStraV's
# DINOv2 backbone; for D3 (XCLIP/CLIP) override to normalize_clip in the experiment script.
train_transform_list:
  - normalize_dinov2
eval_transform_list:
  - normalize_dinov2
