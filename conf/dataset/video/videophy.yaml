name: videophy
# VideoPhy test set (Bansal et al. 2024), D3 Table 3: 10 text-to-video generators, released as URLs (MIT).
# VideoPhyDataset fetches the clips (dead links skipped) and pairs them with GenVideo-Val's MSR-VTT reals, as D3 does.
root_dir: /hddstore/ssalehi/SynthScope/VideoPhy
hf_repo_id: null
num_frames: 16
fps: 8
window_seconds: 2.0
frame_size: 224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 4
persistent_workers: true
pin_memory: true
prefetch: true
# Normalization happens HERE (not in the model). normalize_clip matches D3's default
# XCLIP/CLIP backbone; switch to normalize_dinov2 for a DINOv2/ResNet backbone.
train_transform_list:
  - normalize_clip
eval_transform_list:
  - normalize_clip
