name: genvidbench
# GenVidBench benchmark (Ni et al. 2025), used by ReStraV. Lay out videos as
# <root>/<split>/<generator>/{0_real,1_fake}/*.mp4.
root_dir: /hddstore/ssalehi/AGID/GenVidBench
# Set to a Hugging Face dataset repo to enable the download stub; null = manual placement.
hf_repo_id: null
num_frames: 24
fps: null
window_seconds: 2.0
frame_size: 224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 4
persistent_workers: true
pin_memory: true
prefetch: false
# Normalization happens HERE (not in the model). normalize_dinov2 = ImageNet stats, what
# DINOv2 (ReStraV's backbone) expects.
train_transform_list:
  - normalize_dinov2
eval_transform_list:
  - normalize_dinov2
