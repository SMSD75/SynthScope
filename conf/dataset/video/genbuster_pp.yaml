name: genbuster_pp
# GenBuster-Bench++ (BusterX++, Wen et al. 2025; HF l8cv/GenBuster-Bench-plusplus, MIT), video track: 1000 real + 1000 generated
# clips, the out-of-domain "GB++" of WeVisForensics (Table 4). GenBusterBenchPPDataset downloads the zip at a pinned revision
# and lays the video track out as test/video/{0_real,1_fake} (the image track is not used).
root_dir: /hddstore/ssalehi/SynthScope/GenBuster-Bench-plusplus
hf_repo_id: l8cv/GenBuster-Bench-plusplus
num_frames: 16
fps: 8
window_seconds: 2.0
frame_size: 224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 4
persistent_workers: true
pin_memory: true
prefetch: true
# Normalization happens HERE (not in the model). normalize_clip matches D3's default
# XCLIP/CLIP backbone; switch to normalize_dinov2 for a DINOv2/ResNet backbone.
train_transform_list:
  - normalize_clip
eval_transform_list:
  - normalize_clip
