name: genbuster
# GenBuster-Bench (BusterX, Wen et al. 2025; HF l8cv/GenBuster-Bench, MIT): 1000 real + 2150 generated clips (id / ood / wild),
# the in-domain benchmark of WeVisForensics (Table 4 "GB"). GenBusterBenchDataset downloads the zip at a pinned revision and
# lays it out as test/<split>_<generator>/1_fake with the 1000 reals hard-linked into every test/<split>_<generator>/0_real.
root_dir: /hddstore/ssalehi/SynthScope/GenBuster-Bench
hf_repo_id: l8cv/GenBuster-Bench
num_frames: 16
fps: 8
window_seconds: 2.0
frame_size: 224
train_batch_size: 8
val_batch_size: 8
test_batch_size: 8
num_workers: 4
persistent_workers: true
pin_memory: true
prefetch: true
# Normalization happens HERE (not in the model). normalize_clip matches D3's default
# XCLIP/CLIP backbone; switch to normalize_dinov2 for a DINOv2/ResNet backbone.
train_transform_list:
  - normalize_clip
eval_transform_list:
  - normalize_clip
