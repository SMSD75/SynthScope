defaults:
  - /trainer/default
  - _self_

# D3 is training-free: it carries one dummy parameter so AdamW does not crash, but
# "training" has zero effect. One epoch is enough; the val/test passes produce the
# real (threshold-free AP/AUROC) result.
trainer_type: d3
epochs: 1
lr: 1.0e-6
weight_decay: 0.0
label_smoothing: 0.0
val_interval: 1
test_interval: 1
save_interval: 1
save: false
save_policy: max
warmup:
  mode: off
  warmup_ratio: 0.0
  lr_scheduler: linear
