defaults:
  - /trainer/default
  - _self_

# AIDE's released training recipe (shilinyan99/AIDE main_finetune.py + the paper's GenImage setting): AdamW (betas
# 0.9/0.999, eps 1e-8) lr 5e-4 at effective batch 256 (blr 5e-4 x 256 / 256), weight decay 0, 5 epochs, per-iteration
# half-cosine to min_lr 1e-6 without warmup, timm LabelSmoothingCrossEntropy 0.1, fp32, no gradient clipping, no EMA, seed 0.
# The official batch is 8 GPUs x 32; here 4 GPUs x 8 micro-batch x grad_accum_steps 8 = 256 (a 24 GB GPU fits 8). The
# BatchNorm statistics of the two ResNets are then taken over all 4 GPUs' micro-batches (sync_batchnorm), the 32 images the
# official run normalizes with on each of its GPUs. The checkpoint is the epoch with the highest validation accuracy
# (select: accuracy, the official max_accuracy -> model_best.pth); every epoch is kept as model_<epoch>.pth.
trainer_type: aide
epochs: 5
lr: 5.0e-4
weight_decay: 0.0
label_smoothing: 0.1
seed: 0
sync_batchnorm: true
val_interval: 1
test_interval: 1
save_interval: 1
save: true
save_policy: max
save_path: /nvmestore/ssalehi/SynthScope/models/aide
warmup:
  mode: "off"
  warmup_ratio: 0.05
  lr_scheduler: linear
timm_cosine:
  warmup_epochs: 0
  warmup_lr: 0.0
  min_lr: 1.0e-6
  grad_accum_steps: 8
  save_all: true
  select: accuracy
