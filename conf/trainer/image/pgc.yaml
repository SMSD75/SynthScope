defaults:
  - /trainer/default
  - _self_

# PGC trains LoRA adapters + the residual stream + PGCM + classifier (DINO backbone frozen).
# Official recipe (xiaoyu6868/PGC): AdamW, lr 5e-5, weight_decay 0.05, 100 epochs (--niter 100),
# CosineAnnealingLR over all steps, label smoothing 0.1, effective batch 128.
trainer_type: pgc
epochs: 100
lr: 5.0e-5
weight_decay: 0.05
label_smoothing: 0.1
val_interval: 1
test_interval: 1
save_interval: 1
save: true
save_policy: max
warmup:
  mode: on
  warmup_ratio: 0.05
  lr_scheduler: cosine
