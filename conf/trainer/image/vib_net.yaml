defaults:
  - /trainer/default
  - _self_

# VIB-Net's training recipe. No training code is released; this is the paper's implementation details (Adam, lr 2e-4,
# batch 256, CNNDetection/UFD blur + JPEG augmentation) on the UniversalFakeDetect training loop the released test code
# is built from (train.py + networks/trainer.py: Adam(W) with weight decay 0, the released options' weight_decay 0,
# validation accuracy after every epoch, EarlyStopping patience 5 / delta 0.001 (0.002 after a drop) dividing the
# learning rate by 10 until it falls below 1e-6, at most 100 epochs). Only the VIB head trains (fix_backbone).
trainer_type: vib_net
epochs: 100
lr: 0.0002
weight_decay: 0.0
label_smoothing: 0.0
val_interval: 1
test_interval: 1
save_interval: 1
save: true
save_policy: max
save_path: /nvmestore/ssalehi/SynthScope/models/vib_net
seed: 42
warmup:
  mode: "off"            # quoted: a bare off is YAML boolean False
  warmup_ratio: 0.0
  lr_scheduler: linear
plateau:
  patience: 5
  delta: 0.001
  delta_after_drop: 0.002
  factor: 10
  min_lr: 0.000001
