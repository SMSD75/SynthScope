defaults:
  - /model/default
  - _self_

model_type: vib_net
# Backbone: CLIP:ViT-L/14 is the shipped/working config (the released vib_net.pth is CLIP-based, GenImage
# mAP 83.26). A FLAVA-full path (the paper's Fig. 5 headline backbone) is also implemented in
# SynthScopeVIBNetModel, but frozen-FLAVA + VIB-head training was unstable here (val loss stayed at chance over
# 5 epochs), so CLIP is the default; set backbone_name: FLAVA:facebook/flava-full to experiment.
backbone_name: CLIP:ViT-L/14
vib_hidden_dim: 1024
vib_latent_dim: 256
dropout: 0.5
std_shift: 5.0
freeze_backbone: true

# Test-time preprocessing (official): inference, benchmarks and the end-of-training test.
eval_transform_list: [center_crop_224, to_dtype, normalize_clip]
# Training augmentation.
train_transform_list: [blur_jpeg_cnndet, pad_random_crop_224, random_horizontal_flip, to_dtype, normalize_clip]
# Validation during training (differs from the test-time preprocessing above).
val_transform_list: [blur_jpeg_cnndet_val, center_crop_224, to_dtype, normalize_clip]
