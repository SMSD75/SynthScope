defaults:
  - /model/default
  - _self_

# DINOv2 probe: frozen DINOv2 ViT-L/14 + a linear real/fake head.
model_type: dinov2
backbone_name: dinov2_vitl14
use_adapter: false
bottleneck_dim: 64
freeze_backbone: true

# Test-time preprocessing: inference, benchmarks and the end-of-training test.
eval_transform_list: [resize_short_256, center_crop_224, to_dtype, normalize_imagenet]
# Training augmentation.
train_transform_list: [resize_short_256, gaussian_blur, jpeg_compression, random_crop_224, random_horizontal_flip, to_dtype, normalize_imagenet]
