defaults:
  - /model/default
  - _self_

model_type: aide

convnext_model_name: convnext_xxlarge
convnext_pretrained: laion2b_s34b_b82k_augreg_soup
freeze_convnext: true
semantic_dim: 3072
semantic_proj_dim: 256

# Not read by any code: the two ResNet-50 streams start from random weights, as in the official run (its AIDE_Model builds
# a pretrained state dict from --resnet_path but never calls load_state_dict, and conv1 takes 30 HPF channels anyway).
resnet_pretrained: false
head_hidden: 1024
num_classes: 2

dct:
  window_size: 32
  stride: 16
  output_size: 256
  grade_N: 6

# Test-time preprocessing (official): inference and benchmarks.
eval_transform_list: [aide_five_view]
# Training = the official TrainDataset (data/datasets.py): at native resolution Gaussian blur (3x3, sigma 0.1-3, p 0.1)
# then JPEG (QF 30-100, p 0.1), then the five views; no flip, no crop. aide_five_view_train differs from the official
# transform only in capping the long side at 1024 before the DCT (worker memory).
train_transform_list: [aide_blur, aide_jpeg, aide_five_view_train]
# Validation during training: the official run validates through the same TrainDataset, so the perturbations apply to the
# validation images too.
val_transform_list: [aide_blur, aide_jpeg, aide_five_view_train]
# Caps the long side at 1024 to bound dataloader-worker memory during the end-of-training test; inference and
# benchmarks use the uncapped eval list. No perturbations (the official TestDataset has none).
test_transform_list: [aide_five_view_train]
