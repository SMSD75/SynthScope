defaults:
  - /model/default
  - _self_

# UnivFD (Ojha et al., CVPR'23): frozen CLIP ViT-L/14 image features + a linear real/fake head.
model_type: clip
backbone_name: CLIP:ViT-L/14
use_adapter: false
bottleneck_dim: 64
freeze_backbone: true

# Test-time preprocessing: inference, benchmarks and the end-of-training test.
eval_transform_list: [resize_short_256, center_crop_224, to_dtype, normalize_clip]
# Training augmentation.
train_transform_list: [resize_short_256, gaussian_blur, jpeg_compression, random_crop_224, random_horizontal_flip, to_dtype, normalize_clip]
