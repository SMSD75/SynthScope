defaults:
  - /model/default
  - _self_

# OmniAID v1 (Mirage-Train, the paper's OmniAID-Mirage). Expert configuration of the released checkpoint_omniaid_v1.pth (config_omniaid_mirage_paper.json);
# read from the checkpoint's shapes (experts, rank, router width; top-k from the official config).
model_type: omniaid
CLIP_path: openai/clip-vit-large-patch14-336
num_experts: 6
rank_per_expert: 8
moe_router_hidden_dim: 256
moe_top_k: 2
moe_lambda_orth: 0.001
moe_lambda_balance: 0.001
moe_lambda_gating_cls: 0.1
dropout: 0.0
gradient_checkpointing_enable: false
is_hybrid: true
