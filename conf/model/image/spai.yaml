defaults:
  - /model/default
  - _self_

model_type: spai
backbone_name: ViT-B/16
freeze_backbone: true
input_size: 224          # per-patch size (the circular spectral mask is built at this size)
mask_radius: 16
projection_dim: 1024
# Spectral Context Attention over a grid of 224 patches (official fixed-res variant = 448 -> 2x2 grid).
# Feed the model 448x448 inputs (see the spai transform); set use_sca=false to recover the old
# single-patch fixed-resolution model.
use_sca: true
patch_size: 224
patch_stride: 224
num_heads: 12
attn_embed_dim: 1536

# Test-time preprocessing (official): inference and benchmarks.
eval_transform_list: [cap_long_side_1024, to_dtype]
# Training augmentation. SPAI takes [0, 1] images; ImageNet normalization is applied inside the model.
train_transform_list: [resize_short_256, gaussian_blur, jpeg_compression, random_crop_224, random_horizontal_flip, to_dtype]
# Validation during training (differs from the test-time preprocessing above).
val_transform_list: [resize_short_256, center_crop_224, to_dtype]
# Batchable stand-in for the end-of-training test (the native-resolution eval list varies in size); inference and
# benchmarks use the eval list.
test_transform_list: [resize_short_256, center_crop_224, to_dtype]
