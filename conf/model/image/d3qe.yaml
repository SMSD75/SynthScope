defaults:
  - /model/default
  - _self_

# D3QE (ICCV 2025): frozen LlamaGen VQ-16 quantization error -> D3AT transformer, fused with frozen CLIP ViT-L/14
# features; P(fake) = sigmoid(logit). The official model_epoch_best.pth (HF Yanran21/D3QE, MIT) holds the trained part
# and loads key-for-key as d3qe.pth; CLIP ViT-L/14 (OpenAI) and the VQ tokenizer (HF FoundationVision/LlamaGen
# vq_ds16_c2i.pt) are fetched from their own releases, as in the official code.
model_type: d3qe
vq_checkpoint: null    # local vq_ds16_c2i.pt; null -> $SYNTHSCOPE_LLAMAGEN_VQ, else download from the Hugging Face Hub

# Test-time preprocessing (official): inference, benchmarks and the end-of-training test.
eval_transform_list: [resize_short_256, center_crop_256, to_dtype]
# Training augmentation.
train_transform_list: [resize_short_256, blur_jpeg_cnndet, random_crop_256, random_horizontal_flip, to_dtype]
# Validation during training (differs from the test-time preprocessing above).
val_transform_list: [resize_short_256, blur_jpeg_cnndet_val, center_crop_256, to_dtype]
