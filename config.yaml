DatasetConfig:
  setting: Setting-II
  train_dir: /nvmestore/ssalehi/AGID/AIGIBench/train
  val_dir: /nvmestore/ssalehi/AGID/AIGIBench/val
  test_dir: /nvmestore/ssalehi/AGID/AIGIBench/test
  train_batch_size: 512
  val_batch_size: 2048
  test_batch_size: 2048
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  transform_list:
    - resize
    - to_dtype
    - normalize

TrainerConfig:
  epochs: 10
  lr: 0.001
  val_interval: 1
  test_interval: 1
  save_interval: 1
  save: false
  save_policy: max
  save_path: /nvmestore/ssalehi/AGID/models

ModelConfig:
  backbone_name: dinov2_vits14
  bottleneck_dim: 64
  use_adapter: false

metrics:
  - real_accuracy
  - fake_accuracy

logger:
  type: wandb
  project: AGID
  name: AGID
  tags:
    - AGID
