DatasetConfig:
  setting: Setting-I
  train_dir: /nvmestore/ssalehi/AGID/AIGIBench/train
  val_dir: /nvmestore/ssalehi/AGID/AIGIBench/val
  test_dir: /nvmestore/ssalehi/AGID/AIGIBench/test
  batch_size: 512
  num_workers: 8
  transform_list:
    - resize
    - to_tensor
    - normalize

TrainerConfig:
  epochs: 10
  lr: 0.001
  val_interval: 1
  test_interval: 1
  save_interval: 1
  save: false
  save_policy: max
  save_path: /nvmestore/ssalehi/AGID/models

ModelConfig:
  backbone_name: dinov2_vits14
  bottleneck_dim: 64

metrics:
  - real_accuracy
  - fake_accuracy

logger:
  type: wandb
  project: AGID
  name: AGID
  tags:
    - AGID
